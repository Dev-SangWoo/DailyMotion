openapi: 3.0.3
info:
  title: 데일리모션 API
  version: 1.0.0
  description: |
    데일리모션 프로젝트의 OpenAPI 스펙입니다.
    이 문서는 API 설계도 역할을 하며, 자동 생성된 클라이언트/서버 코드의 기반이 됩니다.

servers:
  - url: http://localhost:8000/api/v1
    description: 로컬 개발 서버
  - url: https://api.dailymotion.example.com/v1
    description: 프로덕션 서버

paths:
  /health:
    get:
      summary: 헬스 체크
      description: 서버 상태를 확인합니다.
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: 서버가 정상 작동 중입니다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time

  /users/me/settings/commute:
    put:
      summary: 출퇴근 설정 저장
      description: |
        사용자의 필수 설정(집, 회사, 목표 도착 시간)을 저장합니다.
        MVP 1: [3. 필수 사용자 설정] 저장 기능
      operationId: updateCommuteSettings
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommuteSettingsRequest'
      responses:
        '200':
          description: 설정이 성공적으로 저장되었습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /briefings/commute:
    get:
      summary: 출근 브리핑 조회
      description: |
        현재 시각 기준으로 출근을 위한 최적의 경로와 알림을 제공합니다.
        MVP 2: [Logic 1.1] 출발 알림 / [Logic 1.2] 마지노선 경고
        저장된 사용자 설정을 기반으로 계산됩니다.
      operationId: getCommuteBriefing
      tags:
        - Briefings
      parameters:
        - name: user_id
          in: query
          description: 사용자 ID
          required: false
          schema:
            type: string
            default: "user_001"
      responses:
        '200':
          description: 출근 브리핑 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommuteBriefingResponse'
        '404':
          description: 사용자를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /briefings/retreat:
    get:
      summary: 퇴근 막차 알림 조회
      description: |
        Phase 12: 퇴근 모드에서 사용자가 선택한 경로의 막차 시간을 알림합니다.
        Logic 1.2 (퇴근 모드) 구현
      operationId: getRetreatModeLastBusAlert
      tags:
        - Briefings
      parameters:
        - name: user_id
          in: query
          description: 사용자 ID
          required: false
          schema:
            type: string
            default: "user_001"
      responses:
        '200':
          description: 퇴근 막차 알림 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetreatBriefingResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /briefings/commute-settings:
    post:
      summary: 출퇴근 설정 저장
      description: |
        Phase 12: 사용자의 출퇴근 설정을 저장합니다.
        집 주소, 회사 주소, 목표 도착 시간 등을 저장합니다.
      operationId: saveCommuteSettings
      tags:
        - Briefings
      parameters:
        - name: user_id
          in: query
          description: 사용자 ID
          required: true
          schema:
            type: string
        - name: home_address
          in: query
          description: 집 주소
          required: true
          schema:
            type: string
        - name: work_address
          in: query
          description: 회사 주소
          required: true
          schema:
            type: string
        - name: target_arrival_hour
          in: query
          description: 도착 목표 시간 (시, 0-23)
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 23
        - name: target_arrival_minute
          in: query
          description: 도착 목표 분 (분, 0-59)
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 59
        - name: first_mile_duration
          in: query
          description: First Mile 도보 시간 (분, 기본값 5)
          required: false
          schema:
            type: integer
            default: 5
            minimum: 0
            maximum: 30
        - name: last_mile_duration
          in: query
          description: Last Mile 도보 시간 (분, 기본값 5)
          required: false
          schema:
            type: integer
            default: 5
            minimum: 0
            maximum: 30
      responses:
        '200':
          description: 설정이 저장되었습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommuteSettingsSaveResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: 출퇴근 설정 조회
      description: |
        Phase 12: 사용자의 저장된 출퇴근 설정을 조회합니다.
      operationId: getCommuteSettings
      tags:
        - Briefings
      parameters:
        - name: user_id
          in: query
          description: 사용자 ID
          required: false
          schema:
            type: string
            default: "user_001"
      responses:
        '200':
          description: 출퇴근 설정 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommuteSettingsGetResponse'
        '404':
          description: 사용자를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /briefings/retreat-choice:
    post:
      summary: 퇴근 목표 선택 저장
      description: |
        Phase 12: 퇴근 모드 사용자 목표 선택을 저장합니다.
        Logic 4.1 구현
        - A: 가장 빠르게 (최단 시간)
        - B: 편안하게 (착석 선호)
        - C: 평소 경로 (습관)
      operationId: saveRetreatChoice
      tags:
        - Briefings
      parameters:
        - name: user_id
          in: query
          description: 사용자 ID
          required: true
          schema:
            type: string
        - name: choice
          in: query
          description: 선택지 (A/B/C)
          required: true
          schema:
            type: string
            enum:
              - "A"
              - "B"
              - "C"
      responses:
        '200':
          description: 선택이 저장되었습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetreatChoiceSaveResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 유효성 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: 퇴근 목표 선택 조회
      description: |
        Phase 12: 사용자의 저장된 퇴근 목표 선택을 조회합니다.
      operationId: getRetreatChoice
      tags:
        - Briefings
      parameters:
        - name: user_id
          in: query
          description: 사용자 ID
          required: false
          schema:
            type: string
            default: "user_001"
      responses:
        '200':
          description: 퇴근 목표 선택 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetreatChoiceGetResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          description: 에러 상세 메시지
      required:
        - detail

    # MVP 1: 출퇴근 설정
    CommuteSettingsRequest:
      type: object
      required:
        - homeAddress
        - workAddress
        - targetArrivalTime
      properties:
        homeAddress:
          type: string
          description: 집 주소
          example: "서울 강남구 역삼동 123-45"
        workAddress:
          type: string
          description: 회사 주소
          example: "서울 중구 을지로 678-90"
        targetArrivalTime:
          type: string
          format: time
          description: 목표 도착 시간 (HH:MM:SS)
          example: "08:50:00"
        firstMileDefaultDuration:
          type: integer
          description: First Mile 기본 소요 시간 (분)
          default: 5
          example: 5
        lastMileDefaultDuration:
          type: integer
          description: Last Mile 기본 소요 시간 (분)
          default: 7
          example: 7

    # 표준 응답 구조
    SuccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: "SETTINGS_SAVED"

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: 에러 코드
              example: "E001"
            message:
              type: string
              description: 에러 메시지
              example: "상세 에러 메시지"
          required:
            - code
            - message

    # MVP 2: 출근 브리핑
    CommuteBriefingResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            alertType:
              type: string
              enum:
                - GO_NOW
                - LAST_CHANCE
                - NO_ACTION
              description: 알림 유형
              example: "GO_NOW"
            message:
              type: string
              description: 사용자에게 표시할 메시지
              example: "8:50 도착을 위해, 지금 집에서 출발하셔서 5분 뒤 오는 [123번 버스]를 타세요."
            recommendedTransport:
              $ref: '#/components/schemas/RecommendedTransport'
          required:
            - alertType
            - message

    RecommendedTransport:
      type: object
      properties:
        type:
          type: string
          enum:
            - BUS
            - SUBWAY
            - WALK
          description: 교통수단 유형
          example: "BUS"
        name:
          type: string
          description: 교통수단 이름 (버스 번호, 지하철 노선 등)
          example: "123번"
        departureInMinutes:
          type: integer
          description: 출발까지 남은 시간 (분)
          example: 5
      required:
        - type
        - name
        - departureInMinutes

    # Phase 12: 퇴근 모드 관련 응답
    RetreatBriefingResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              description: 막차 알림 메시지
              example: "선택하신 [B. 편안하게(착석)]의 막차가 30분 뒤입니다."
            recommendedTransport:
              $ref: '#/components/schemas/RecommendedTransport'
          required:
            - message

    # Phase 12: 출퇴근 설정 저장 응답
    CommuteSettingsSaveResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            action:
              type: string
              enum:
                - SETTINGS_SAVED
              example: "SETTINGS_SAVED"
            userId:
              type: string
              description: 사용자 ID
              example: "user_001"
            message:
              type: string
              description: 성공 메시지
              example: "설정이 저장되었습니다."
            settings:
              type: object
              properties:
                homeAddress:
                  type: string
                  example: "서울 강남구 역삼동"
                workAddress:
                  type: string
                  example: "서울 중구 을지로"
                targetArrivalTime:
                  type: string
                  format: time
                  example: "08:50"
                firstMileDefaultDuration:
                  type: integer
                  example: 5
                lastMileDefaultDuration:
                  type: integer
                  example: 7
          required:
            - action
            - userId
            - message

    # Phase 12: 출퇴근 설정 조회 응답
    CommuteSettingsGetResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            userId:
              type: string
              description: 사용자 ID
              example: "user_001"
            homeAddress:
              type: string
              description: 집 주소
              example: "서울 강남구 역삼동"
            workAddress:
              type: string
              description: 회사 주소
              example: "서울 중구 을지로"
            targetArrivalTime:
              type: string
              format: time
              description: 목표 도착 시간 (HH:MM)
              example: "08:50"
            firstMileDefaultDuration:
              type: integer
              description: First Mile 도보 시간 (분)
              example: 5
            lastMileDefaultDuration:
              type: integer
              description: Last Mile 도보 시간 (분)
              example: 7
          required:
            - userId
            - homeAddress
            - workAddress
            - targetArrivalTime

    # Phase 12: 퇴근 목표 저장 응답
    RetreatChoiceSaveResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            action:
              type: string
              enum:
                - CHOICE_SAVED
              example: "CHOICE_SAVED"
            userId:
              type: string
              description: 사용자 ID
              example: "user_001"
            selectedChoice:
              type: string
              enum:
                - "A"
                - "B"
                - "C"
              description: 선택한 경로 (A/B/C)
              example: "B"
            selectedLabel:
              type: string
              description: 선택지 레이블
              example: "편안하게"
            message:
              type: string
              description: 성공 메시지
              example: "퇴근 목표 '편안하게'로 저장되었습니다."
          required:
            - action
            - userId
            - selectedChoice
            - selectedLabel

    # Phase 12: 퇴근 목표 조회 응답
    RetreatChoiceGetResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            userId:
              type: string
              description: 사용자 ID
              example: "user_001"
            selectedChoice:
              type: string
              enum:
                - "A"
                - "B"
                - "C"
              description: 선택한 경로 (A/B/C)
              example: "B"
            selectedLabel:
              type: string
              description: 선택지 레이블
              example: "편안하게"
          required:
            - userId
            - selectedChoice
            - selectedLabel

tags:
  - name: Health
    description: 헬스 체크 관련 엔드포인트
  - name: Users
    description: 사용자 관련 엔드포인트
  - name: Briefings
    description: 브리핑 관련 엔드포인트

